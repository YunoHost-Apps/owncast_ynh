packaging_format = 2

id = "owncast"
name = "Owncast"
description.en = "Live video and web chat server"
description.fr = "Serveur de vidéo en direct et de chat Web"

version = "0.3.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://owncast.online/"
demo = "https://watch.owncast.online/"
admindoc = "https://owncast.online/docs/"
code = "https://github.com/owncast/owncast"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "armhf", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "If enabled, Owncast will be accessible by people who do not have an account. This can be changed later via the webadmin."
    help.fr = "Si cette case est cochée, Owncast sera accessible aux personnes n’ayant pas de compte. Vous pourrez changer ceci plus tard via la webadmin."
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        amd64.url = "https://github.com/owncast/owncast/releases/download/v0.3.0/owncast-0.3.0-linux-64bit.zip"
        amd64.sha256 = "8753c12ce58b7d1120c815e49d19f8fd3cc1a53dc8e0abb581e212694ca670d8"
        arm64.url = "https://github.com/owncast/owncast/releases/download/v0.3.0/owncast-0.3.0-linux-arm64.zip"
        arm64.sha256 = "81dddbe81122fb998a071035f50aa3f6cbfc0a39d72a7a37ecb80118846b4256"
        armhf.url = "https://github.com/owncast/owncast/releases/download/v0.3.0/owncast-0.3.0-linux-arm7.zip"
        armhf.sha256 = "d88a095d6424a97642b2f3c0188127bfb3cd36b0f46d0dafee36a496514f7234"
        in_subdir = false
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = ".*-linux-64bit.zip"
        autoupdate.asset.arm64 = ".*-linux-arm64.zip"
        autoupdate.asset.armhf = ".*-linux-arm7.zip"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]
    stream.default = 1935
    stream.exposed = "TCP"

    [resources.apt]
    packages = "ffmpeg"
